name: Build Lavender

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: lets test builds post their logs to this repo's issues. Masked in the build log.
      LOG_UPLOAD_TOKEN: ${{ secrets.LOG_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavender-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "latest-build" release, for downloading straight to the phone
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk lavender.apk
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release delete latest-build --yes --cleanup-tag || true
          # The app's update check reads versionCode from these notes.
          gh release create latest-build lavender.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Lavender $VERSION_NAME ($VERSION_CODE)" \
            --notes "versionCode: $VERSION_CODE
          versionName: $VERSION_NAME
          commit: $GITHUB_SHA

          Install over the previous version; alarms are kept."
