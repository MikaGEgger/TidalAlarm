name: Build test app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alarm-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as a release, so it can be downloaded straight to the phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk alarm-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build alarm-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Alarm test app" \
            --notes "Test app for the TIDAL hand-off. Built from $GITHUB_SHA on branch $GITHUB_REF_NAME."
